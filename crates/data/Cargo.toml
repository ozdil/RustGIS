[package]
name = "rustgis-data"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustGIS L1: feature model, attribute values, vector I/O (GeoJSON, CSV, Shapefile, GeoPackage, GeoParquet, FlatGeobuf, KML/KMZ, GPX), data providers (GeoParquet, FlatGeobuf, GeoPackage) and rasters (GeoTIFF, ASCII grid)"

[lints]
workspace = true

[dependencies]
rustgis-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
csv = { workspace = true }
shapefile = { workspace = true }
tiff = { workspace = true }
proj4rs = { workspace = true }
crs-definitions = { workspace = true }
miniz_oxide = { workspace = true }
roxmltree = { workspace = true }
parquet = { workspace = true }
bytes = { workspace = true }
flatgeobuf = { workspace = true }
geozero = { workspace = true }
# KML ground overlays are PNG or JPEG pictures.
image = { workspace = true, features = ["jpeg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# zstd is C: native only. GeoParquet files compressed with it don't open in the browser yet.
parquet = { workspace = true, features = ["zstd"] }
rusqlite = { workspace = true }

[dev-dependencies]
# Writing sample GeoParquet files.
parquet = { workspace = true, features = ["arrow"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
